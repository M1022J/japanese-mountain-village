<style>html,body{background:#79aee8;height:100%;margin:0;padding:0;font-family:PingFang SC,Microsoft YaHei,sans-serif;overflow:hidden}#app{position:fixed;inset:0}canvas{display:block}#hud{color:#fff;pointer-events:none;z-index:5;text-shadow:0 1px 4px #00000073;position:fixed;top:14px;left:14px}#hud h1{letter-spacing:.12em;margin:0 0 2px;font-size:19px;font-weight:600}#zone{opacity:.95;font-size:14px}#compass{opacity:.8;margin-top:2px;font-size:12px}#help{color:#fff;pointer-events:none;z-index:5;text-shadow:0 1px 3px #00000080;font-size:12.5px;line-height:1.7;position:fixed;bottom:12px;left:14px}#loading{color:#fff;z-index:20;background:linear-gradient(#6ea3dd,#a8c8ec);flex-direction:column;justify-content:center;align-items:center;transition:opacity .6s;display:flex;position:fixed;inset:0}#loading h1{letter-spacing:.3em;text-shadow:0 2px 8px #28466e66;margin:0 0 6px;font-size:26px;font-weight:600}#loading p{opacity:.9;letter-spacing:.15em;margin:2px 0 14px;font-size:13px}#barwrap{background:#ffffff4d;border-radius:4px;width:min(420px,80vw);height:8px;overflow:hidden}#bar{background:#fff;border-radius:4px;width:0%;height:100%;transition:width .2s}#startbtn{letter-spacing:.2em;color:#fff;cursor:pointer;background:#b3311f;border:none;border-radius:24px;margin-top:20px;padding:12px 42px;font-size:16px;display:none;box-shadow:0 4px 14px #00000040}#startbtn:hover{background:#c2482c}#toast{color:#fff;letter-spacing:.35em;text-shadow:0 2px 10px #0000008c;opacity:0;pointer-events:none;z-index:6;font-size:21px;transition:opacity .8s;position:fixed;top:18%;left:50%;transform:translate(-50%)}#joy{z-index:8;touch-action:none;background:#ffffff24;border:1.5px solid #fff6;border-radius:50%;width:112px;height:112px;display:none;position:fixed;bottom:26px;left:22px}#stick{background:#ffffff8c;border-radius:50%;width:44px;height:44px;position:absolute;top:34px;left:34px}#jumpbtn{color:#fff;z-index:8;background:#fff3;border:1.5px solid #ffffff73;border-radius:50%;width:64px;height:64p
